<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Остров</title>
<meta name="description" content="Жизнь как долгая игра: сезоны, квесты и 3D-остров, который растёт вместе с тобой годами.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Остров">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <aside class="notes" id="notes" aria-label="Как устроен экран"></aside>

  <div class="device">
    <div class="app" id="app">
      <main class="screen" id="screen" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Разделы">
        <button class="tab" type="button" data-tab="today" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <span>Сегодня</span>
        </button>
        <button class="tab" type="button" data-tab="season">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
          <span>Сезон</span>
        </button>
        <button class="tab-add" type="button" data-action="capture" aria-label="Записать мысль или сделанное">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="tab" type="button" data-tab="island">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h18l-4 3.5-5 4.5-5-4.5z"/><path d="M12 13V8"/><circle cx="12" cy="6" r="3"/></svg>
          <span>Остров</span>
        </button>
        <button class="tab" type="button" data-tab="chronicle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg>
          <span>Летопись</span>
        </button>
      </nav>

      <div class="sheet-layer" id="sheetLayer" hidden></div>
      <div class="overlay-layer" id="overlayLayer" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <aside class="demo" id="demo" aria-label="Демо-управление"></aside>
</div>

<script src="island.js"></script>
<script src="app.js"></script>
<script type="module">
  // three.js лежит в vendor/, чтобы остров работал без сети. При открытии файла двойным кликом
  // браузер не даёт загрузить локальный модуль, тогда берём ту же версию с CDN.
  let THREE;
  try { THREE = await import('./vendor/three.module.min.js'); }
  catch (e) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js'); }
  window.THREE = THREE;
  window.dispatchEvent(new Event('three-ready'));
</script>
<script>
  // Офлайн и установка работают только по https. На localhost включаются параметром ?sw,
  // чтобы при разработке правки не застревали в кеше.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if (location.protocol === 'https:' && !local || local && /[?&]sw\b/.test(location.search)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  })();
</script>
</body>
</html>
